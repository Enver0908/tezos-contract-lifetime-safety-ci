name: Tezos Contract Lifetime Safety

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lifetime-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install project into the runner Python environment
        run: python -m pip install .
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run bounded sequence acceptance
        run: python -m tlsci acceptance
      - name: Check installed CLI from outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          tlsci --runtime "$GITHUB_WORKSPACE/runtime.lock.json" doctor
      - name: Run synthetic lifetime guard
        run: |
          cd "$RUNNER_TEMP"
          tlsci --runtime "$GITHUB_WORKSPACE/runtime.lock.json" run \
            --manifest "$GITHUB_WORKSPACE/fixtures/synthetic/manifest.json" \
            --baseline "$GITHUB_WORKSPACE/fixtures/synthetic/baseline.json" \
            --policy "$GITHUB_WORKSPACE/policy.json" \
            --output-dir "$GITHUB_WORKSPACE/outputs/ci" \
            --timeout 60
      - name: Verify regression gate returns failure on controlled change
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP"
          tlsci --runtime "$GITHUB_WORKSPACE/runtime.lock.json" run \
            --manifest "$GITHUB_WORKSPACE/fixtures/synthetic/regression-gate-controlled-manifest.json" \
            --baseline "$GITHUB_WORKSPACE/fixtures/synthetic/regression-gate-baseline.json" \
            --policy "$GITHUB_WORKSPACE/policy.json" \
            --output-dir "$GITHUB_WORKSPACE/outputs/regression-ci" \
            --timeout 60
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected controlled regression exit code 1, received $status"
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path(os.environ["GITHUB_WORKSPACE"]) / "outputs" / "regression-ci" / "report.json"
          report = json.loads(report_path.read_text())
          decisions = report["decisions"]
          assert decisions and all("GAS_REGRESSION" in item["rule_ids"] for item in decisions)
          PY
      - name: Upload lifetime report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tezos-lifetime-safety-report
          path: |
            outputs/ci/
            outputs/regression-ci/
          if-no-files-found: error
          retention-days: 7
